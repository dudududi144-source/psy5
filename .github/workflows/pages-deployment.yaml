name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'worklets/**'
      - 'tools/**'
      - '.github/workflows/*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify (syntax + structure gates)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify JS + HTML gates
        run: node tools/verify.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        # v0.21.0: the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo
        # secrets are NOT set — every deploy of this workflow failed with
        # "In a non-interactive environment, it's necessary to set a
        # CLOUDFLARE_API_TOKEN" (pre-existing, since at least v0.19.0).
        # The LIVE site is GitHub Pages (deploy-gh-pages.yml — green).
        # continue-on-error keeps the deploy INTENT wired: add the two
        # secrets and Cloudflare Pages deploys again on the next push;
        # until then the red X stops being a false alarm.
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy playground --project-name=psy6
